[package]
name = "bq76952"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-hal = "1.0"

[dev-dependencies]
embedded-hal-mock = "0.11"
linux-embedded-hal = "0.4"

[profile.release]
opt-level = "s"      # Optimize for size
lto = true           # Link-Time Optimization
codegen-units = 1    # Better optimizations
panic = "abort"      # Lower binary size for no_std
